name: SparkMatch CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Check server syntax
        run: node -c server.js

      - name: Check frontend syntax (ES modules)
        run: |
          for f in public/js/app.js public/js/state.js public/js/utils.js public/js/socket.js public/js/api.js public/js/location.js public/js/matchmaking.js public/js/webrtc.js public/js/chat/voiceRecorder.js public/js/chat/chatCall.js; do
            echo "Checking $f"
            node --input-type=module --check < "$f"
          done
